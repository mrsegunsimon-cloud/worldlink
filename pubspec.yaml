name: worldlink
description: WorldLink - videos, music, travel, sports and daily life in one app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.9.2
  just_audio: ^0.9.40
  url_launcher: ^6.3.1
  webview_flutter: ^4.9.0
  webview_flutter_android: ^4.0.0
  webview_flutter_platform_interface: ^2.10.0
  file_picker: ^8.1.2
  permission_handler: ^11.3.1
  geolocator: ^13.0.1
  http: ^1.2.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/photos/
    - assets/media/
    - assets/data/
    - assets/web/
    - assets/firebase_config.json

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.24
