name: Ping checker
on:
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the payment checker without a signature
        run: |
          R=$(curl -s -w " HTTP:%{http_code}" -X POST -H "Content-Type: application/json" -d '{"event":"charge.success"}' "https://vmalcnldyisdofkkchnc.supabase.co/functions/v1/hyper-function")
          echo "::notice title=checker::$R"
