name: Website
on:
  push:
    branches: [main]
    paths: ['assets/web/**', 'tools/**', 'assets/firebase_config.json', '.github/workflows/web.yml']
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the website page
        run: |
          mkdir -p site
          python3 tools/make_web.py assets/web/index.html assets/firebase_config.json site/index.html
          touch site/.nojekyll
      - name: Fresh news
        continue-on-error: true
        run: python3 tools/fetch_news.py site/news.json
      - name: Fresh sports scores
        continue-on-error: true
        run: python3 tools/fetch_sports.py site/sports.json
      - name: Music videos
        continue-on-error: true
        run: python3 tools/fetch_music.py site/music.json
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
