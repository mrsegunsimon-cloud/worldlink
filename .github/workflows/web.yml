name: Website
on:
  push:
    branches: [main]
    paths: ['assets/web/**', 'tools/**', 'assets/firebase_config.json', '.github/workflows/web.yml']
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the website page
        run: |
          mkdir -p site
          python3 tools/make_web.py assets/web/index.html assets/firebase_config.json site/index.html
          python3 tools/fetch_news.py site/news.json || true
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
