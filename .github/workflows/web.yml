name: Website
on:
  push:
    branches: [main]
    paths: ['assets/web/**', 'tools/**', 'assets/firebase_config.json', '.github/workflows/web.yml']
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the website page
        run: |
          mkdir -p site
          python3 tools/make_web.py assets/web/index.html assets/firebase_config.json site/index.html
          touch site/.nojekyll
      - name: Background uploads (service worker)
        run: cp tools/sw.js site/sw.js
      - name: Fast video cutter
        continue-on-error: true
        run: |
          mkdir -p /tmp/ff && cd /tmp/ff
          npm pack @ffmpeg/ffmpeg@0.12.10 @ffmpeg/core@0.12.6
          mkdir a b && tar xzf ffmpeg-ffmpeg-*.tgz -C a && tar xzf ffmpeg-core-*.tgz -C b
          cd - 
          mkdir -p site/ffmpeg/core
          cp /tmp/ff/a/package/dist/umd/*.js site/ffmpeg/
          cp /tmp/ff/b/package/dist/umd/ffmpeg-core.js /tmp/ff/b/package/dist/umd/ffmpeg-core.wasm site/ffmpeg/core/
          W=$(ls site/ffmpeg | grep -v '^ffmpeg.js$' | grep 'ffmpeg.js$' | head -1)
          echo "{\"worker\":\"$W\"}" > site/ffmpeg/files.json
          cat site/ffmpeg/files.json; ls -la site/ffmpeg site/ffmpeg/core
      - name: Beach list
        continue-on-error: true
        run: cp assets/beaches.json site/beaches.json
      - name: Starter videos
        continue-on-error: true
        run: mkdir -p site/starter && cp assets/starter/*.mp4 site/starter/
      - name: Fresh news
        continue-on-error: true
        run: python3 tools/fetch_news.py site/news.json
      - name: Fresh sports scores
        continue-on-error: true
        run: python3 tools/fetch_sports.py site/sports.json
      - name: Music videos
        continue-on-error: true
        run: python3 tools/fetch_music.py site/music.json
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
