name: Beaches
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 1 * *'
permissions:
  contents: write
jobs:
  beaches:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Collect beaches for every country
        continue-on-error: true
        run: python3 tools/fetch_beaches.py assets/beaches.json
      - name: Save the list
        if: always()
        run: |
          git config user.name "worldlink-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add assets/beaches.json
          git diff --cached --quiet || git commit -m "Update beach list"
          git pull --rebase origin main
          git push
