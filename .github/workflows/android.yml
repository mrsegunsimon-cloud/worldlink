name: Android build
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Generate platform folders
        run: flutter create --platforms=android,ios --org com.worldlink --project-name worldlink .
      - name: Allow internet and Firebase minimum Android version
        run: |
          sed -i 's/flutter.minSdkVersion/23/' android/app/build.gradle* || true
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          grep -n "INTERNET" android/app/src/main/AndroidManifest.xml
          grep -n "minSdk" android/app/build.gradle*
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: worldlink-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
