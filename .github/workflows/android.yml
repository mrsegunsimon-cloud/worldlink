name: Android build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Generate platform folders
        run: flutter create --platforms=android,ios --org com.worldlink --project-name worldlink .
      - name: Allow internet and Firebase minimum Android version
        run: |
          sed -i 's/flutter.minSdkVersion/23/' android/app/build.gradle* || true
          sed -i -E 's/compileSdk(Version)?( =|) *flutter\.compileSdkVersion/compileSdk = 36/' android/app/build.gradle* || true
          grep -n "compileSdk" android/app/build.gradle*
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<application android:allowBackup="false" android:usesCleartextTraffic="false"|' android/app/src/main/AndroidManifest.xml
          grep -n "INTERNET\|LOCATION" android/app/src/main/AndroidManifest.xml
          grep -n "minSdk" android/app/build.gradle*
      - name: Use the fixed signing key so the app fingerprint never changes
        run: |
          mkdir -p ~/.android
          cp tools/debug.keystore ~/.android/debug.keystore
      - name: App name and icon
        run: |
          sed -i 's|android:label="[^"]*"|android:label="WorldLink"|' android/app/src/main/AndroidManifest.xml
          pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          im=Image.open("assets/pwa/icon-512.png").convert("RGBA")
          for n,z in [("mdpi",48),("hdpi",72),("xhdpi",96),("xxhdpi",144),("xxxhdpi",192)]:
              im.resize((z,z),Image.LANCZOS).save(f"android/app/src/main/res/mipmap-{n}/ic_launcher.png")
          PY
      - run: flutter pub get
      - name: Build the APK (and show the first errors if it fails)
        shell: bash
        run: |
          set +e
          flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --obfuscate --split-debug-info=build/symbols > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -nE "Error:|error:|rror:|What went wrong|FAILURE|Could not|not found|isn't defined|undefined" build.log | head -12 | while IFS= read -r l; do echo "::error::${l:0:300}"; done
            grep -A9 "What went wrong" build.log | head -14 | while IFS= read -r l; do echo "::error::W ${l:0:300}"; done
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: worldlink-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Put the app on the Releases page (plain download, no zip)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk WorldLink.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest WorldLink.apk --title "WorldLink app (latest build)" --notes "Newest Android build, made $(date -u +%Y-%m-%d' '%H:%M) UTC from commit ${GITHUB_SHA::7}."

      - name: Play Store bundle (AAB), signed with the upload key
        if: github.ref == 'refs/heads/main'
        env:
          KS_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.UPLOAD_KEYSTORE_PASS }}
        run: |
          if [ -z "$KS_B64" ]; then echo "No upload key secret yet - skipping the Play bundle."; exit 0; fi
          flutter build appbundle --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --obfuscate --split-debug-info=build/symbols2
          printf '%s\n' "$KS_B64" | grep -o 'MIIK[A-Za-z0-9+/=]*' | head -1 | tr -d '\n' > /tmp/up.b64
          echo "Key secret length: $(wc -c < /tmp/up.b64) (should be 3560)"
          base64 -d /tmp/up.b64 > /tmp/up.jks || { echo "::error::UPLOAD_KEYSTORE_B64 was pasted incompletely. Length is $(wc -c < /tmp/up.b64), it should be 3560."; exit 1; }
          KS_PASS=$(printf %s "$KS_PASS" | tr -d ' \r\n\t"')
          echo "Password length: ${#KS_PASS} (should be 24)"
          keytool -list -keystore /tmp/up.jks -storepass "$KS_PASS" 2>&1 | head -5 || true
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore /tmp/up.jks -storepass "$KS_PASS" -keypass "$KS_PASS" build/app/outputs/bundle/release/app-release.aab worldlink-upload
          cp build/app/outputs/bundle/release/app-release.aab WorldLink-play.aab
          rm -f /tmp/up.jks
      - name: Keep the Play bundle
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: worldlink-play-aab
          path: WorldLink-play.aab
          if-no-files-found: ignore
