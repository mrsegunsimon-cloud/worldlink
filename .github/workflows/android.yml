name: Android build
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Generate platform folders
        run: flutter create --platforms=android,ios --org com.worldlink --project-name worldlink .
      - name: Allow internet and Firebase minimum Android version
        run: |
          sed -i 's/flutter.minSdkVersion/23/' android/app/build.gradle* || true
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          grep -n "INTERNET\|LOCATION" android/app/src/main/AndroidManifest.xml
          grep -n "minSdk" android/app/build.gradle*
      - name: Use the fixed signing key so the app fingerprint never changes
        run: |
          mkdir -p ~/.android
          cp tools/debug.keystore ~/.android/debug.keystore
      - run: flutter pub get
      - name: Build the APK (and show the first errors if it fails)
        shell: bash
        run: |
          set +e
          flutter build apk --release > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -nE "Error:|error:|rror:|What went wrong|FAILURE|Could not|not found|isn't defined|undefined" build.log | head -12 | while IFS= read -r l; do echo "::error::${l:0:300}"; done
            tail -5 build.log | while IFS= read -r l; do echo "::error::${l:0:300}"; done
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: worldlink-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
